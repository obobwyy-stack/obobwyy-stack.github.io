<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客导航 - Cai Yi Zeng</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100 flex items-center justify-center p-4">
    <div class="w-full max-w-2xl">
        <!-- Main Card Container -->
        <div class="bg-white rounded-2xl shadow-2xl shadow-slate-200/50 p-8 md:p-12 backdrop-blur-sm">
            <!-- Header -->
            <div class="text-center mb-10">
                <div class="flex items-center justify-center gap-3 mb-2">
                    <i data-lucide="layout-dashboard" class="w-8 h-8 text-slate-600"></i>
                    <h1 class="text-3xl font-semibold text-slate-800 tracking-tight">博客导航</h1>
                </div>
                <p class="text-slate-500 text-sm mt-2">探索我的技术文章与思考</p>
            </div>

            <!-- Navigation Grid -->
            <div class="space-y-3">
                <!-- Blog Posts Section -->
                <div class="flex items-center gap-2 text-xs font-medium text-slate-400 uppercase tracking-wider mb-3">
                    <i data-lucide="file-text" class="w-4 h-4"></i>
                    文章
                </div>

                <a href="/2026/08/02/我的第一篇技术文章/" class="group block">
                    <div class="p-4 bg-white border-2 border-slate-200 rounded-xl hover:border-blue-400 hover:bg-slate-50 transition-all duration-300 hover:scale-[1.02] hover:shadow-lg">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <i data-lucide="code-2" class="w-5 h-5 text-slate-400 group-hover:text-blue-500 transition-colors"></i>
                                <span class="font-medium text-slate-700">我的第一篇技术文章</span>
                            </div>
                            <i data-lucide="arrow-right" class="w-4 h-4 text-slate-300 group-hover:text-blue-500 group-hover:translate-x-1 transition-all"></i>
                        </div>
                    </div>
                </a>

                <a href="/2026/08/02/hexo-blog-setup-complete/" class="group block">
                    <div class="p-4 bg-white border-2 border-slate-200 rounded-xl hover:border-blue-400 hover:bg-slate-50 transition-all duration-300 hover:scale-[1.02] hover:shadow-lg">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <i data-lucide="settings" class="w-5 h-5 text-slate-400 group-hover:text-blue-500 transition-colors"></i>
                                <span class="font-medium text-slate-700">Hexo 博客设置完成</span>
                            </div>
                            <i data-lucide="arrow-right" class="w-4 h-4 text-slate-300 group-hover:text-blue-500 group-hover:translate-x-1 transition-all"></i>
                        </div>
                    </div>
                </a>

                <a href="/2026/08/02/vibecoding流程演进/" class="group block">
                    <div class="p-4 bg-white border-2 border-slate-200 rounded-xl hover:border-blue-400 hover:bg-slate-50 transition-all duration-300 hover:scale-[1.02] hover:shadow-lg">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <i data-lucide="git-branch" class="w-5 h-5 text-slate-400 group-hover:text-blue-500 transition-colors"></i>
                                <span class="font-medium text-slate-700">Vibecoding 流程演进</span>
                            </div>
                            <i data-lucide="arrow-right" class="w-4 h-4 text-slate-300 group-hover:text-blue-500 group-hover:translate-x-1 transition-all"></i>
                        </div>
                    </div>
                </a>

                <a href="/hello-world.html" class="group block">
                    <div class="p-4 bg-white border-2 border-slate-200 rounded-xl hover:border-blue-400 hover:bg-slate-50 transition-all duration-300 hover:scale-[1.02] hover:shadow-lg">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <i data-lucide="sparkles" class="w-5 h-5 text-slate-400 group-hover:text-blue-500 transition-colors"></i>
                                <span class="font-medium text-slate-700">Hello World</span>
                            </div>
                            <i data-lucide="arrow-right" class="w-4 h-4 text-slate-300 group-hover:text-blue-500 group-hover:translate-x-1 transition-all"></i>
                        </div>
                    </div>
                </a>

                <!-- Pages Section -->
                <div class="flex items-center gap-2 text-xs font-medium text-slate-400 uppercase tracking-wider mb-3 mt-6">
                    <i data-lucide="folder" class="w-4 h-4"></i>
                    页面
                </div>

                <a href="/about/" class="group block">
                    <div class="p-4 bg-white border-2 border-slate-200 rounded-xl hover:border-blue-400 hover:bg-slate-50 transition-all duration-300 hover:scale-[1.02] hover:shadow-lg">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <i data-lucide="user" class="w-5 h-5 text-slate-400 group-hover:text-blue-500 transition-colors"></i>
                                <span class="font-medium text-slate-700">关于我</span>
                            </div>
                            <i data-lucide="arrow-right" class="w-4 h-4 text-slate-300 group-hover:text-blue-500 group-hover:translate-x-1 transition-all"></i>
                        </div>
                    </div>
                </a>

                <a href="/categories/" class="group block">
                    <div class="p-4 bg-white border-2 border-slate-200 rounded-xl hover:border-blue-400 hover:bg-slate-50 transition-all duration-300 hover:scale-[1.02] hover:shadow-lg">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <i data-lucide="tag" class="w-5 h-5 text-slate-400 group-hover:text-blue-500 transition-colors"></i>
                                <span class="font-medium text-slate-700">分类</span>
                            </div>
                            <i data-lucide="arrow-right" class="w-4 h-4 text-slate-300 group-hover:text-blue-500 group-hover:translate-x-1 transition-all"></i>
                        </div>
                    </div>
                </a>

                <a href="/tags/" class="group block">
                    <div class="p-4 bg-white border-2 border-slate-200 rounded-xl hover:border-blue-400 hover:bg-slate-50 transition-all duration-300 hover:scale-[1.02] hover:shadow-lg">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <i data-lucide="hash" class="w-5 h-5 text-slate-400 group-hover:text-blue-500 transition-colors"></i>
                                <span class="font-medium text-slate-700">标签</span>
                            </div>
                            <i data-lucide="arrow-right" class="w-4 h-4 text-slate-300 group-hover:text-blue-500 group-hover:translate-x-1 transition-all"></i>
                        </div>
                    </div>
                </a>
            </div>

            <!-- Footer Note -->
            <div class="mt-10 text-center">
                <div class="flex items-center justify-center gap-2 text-slate-400 text-sm">
                    <i data-lucide="mouse-pointer-click" class="w-4 h-4"></i>
                    <span>点击任意标题即可跳转到对应页面</span>
                </div>
            </div>
        </div>

        <!-- Copyright -->
        <div class="text-center mt-6 text-slate-400 text-xs">
            © 2026 Cai Yi Zeng · Powered by Hexo
        </div>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();
    </script>
</body>
</html>
